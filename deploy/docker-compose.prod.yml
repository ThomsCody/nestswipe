services:
  caddy:
    image: nestswipe-caddy:2.11.7-security
    build:
      context: ./caddy
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  frontend-build:
    build:
      context: ../frontend
      target: build
      args:
        GIT_REVISION: ${GIT_REVISION:-}
        VITE_DD_APPLICATION_ID: ${VITE_DD_APPLICATION_ID}
        VITE_DD_CLIENT_TOKEN: ${VITE_DD_CLIENT_TOKEN}
        VITE_DD_SITE: ${VITE_DD_SITE:-datadoghq.com}
        VITE_DD_ENV: ${VITE_DD_ENV:-prod}
        VITE_DD_ALLOWED_TRACING_URL: ${VITE_DD_ALLOWED_TRACING_URL:-https://nestswipe.freeddns.org}
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /output/"]
    volumes:
      - frontend_dist:/output

  postgres:
    image: postgres:16.16-alpine@sha256:ddc1c45d23db7f0702f5a2727e28f24cbb75746f625c8c5083a190e50cf01740
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_activity_query_size=4096
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "nestswipe-db"}]'
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: /garage server --single-node
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    secrets:
      - garage_rpc_secret
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      target: prod
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: garage:3900
      STORAGE_REGION: garage
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STORAGE_ACCESS_KEY_FILE: /run/secrets/garage_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/garage_secret_key
      STORAGE_BUCKET: ${STORAGE_BUCKET:-listing-photos}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      EMAIL_POLL_INTERVAL_MINUTES: ${EMAIL_POLL_INTERVAL_MINUTES:-5}
      LISTING_PROBES_ENABLED: "false"
      DECODO_API_KEY_FILE: /run/secrets/decodo_api_key
      DECODO_WEB_DATA_API_KEY_FILE: /run/secrets/decodo_web_data_api_key
      DECODO_WEB_DATA_CACHE_TTL_SECONDS: ${DECODO_WEB_DATA_CACHE_TTL_SECONDS:-86400}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_USER_FILE: /run/secrets/proxy_user
      PROXY_PASSWORD_FILE: /run/secrets/proxy_password
      SELOGER_BROWSER_URL: http://seloger-browser:8000
      SENDGRID_API_KEY_FILE: /run/secrets/sendgrid_api_key
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      GOOGLE_REDIRECT_URI: https://nestswipe.freeddns.org/api/v1/auth/google/callback
      ALLOWED_ORIGINS: https://nestswipe.freeddns.org
      FRONTEND_URL: https://nestswipe.freeddns.org
      # Datadog APM
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_SERVICE: nestswipe-backend
      DD_ENV: prod
      DD_VERSION: ${DD_VERSION:-latest}
      DD_TRACE_ENABLED: "true"
      DD_DBM_PROPAGATION_MODE: full
      DD_PSYCOPG_SERVICE: nestswipe-db
      DD_LOGS_INJECTION: "true"
      DD_IAST_ENABLED: "true"
      DD_PROFILING_ENABLED: "true"
      DD_DYNAMIC_INSTRUMENTATION_ENABLED: "true"
      # Datadog LLM Observability
      DD_LLMOBS_ENABLED: "true"
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-nestswipe}
    volumes:
      - ./oauth.json:/app/oauth.json:ro
      - /var/run/datadog:/var/run/datadog:ro
      - web_data_state:/var/lib/nestswipe/web-data
    secrets:
      - database_url
      - garage_access_key
      - garage_secret_key
      - jwt_secret
      - decodo_api_key
      - decodo_web_data_api_key
      - proxy_user
      - proxy_password
      - sendgrid_api_key
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-backend"}]'
    restart: unless-stopped

  seloger-browser:
    build:
      context: ../browser
      args:
        GIT_REVISION: ${GIT_REVISION:-}
    environment:
      PROXY_USER_FILE: /run/secrets/proxy_user
      PROXY_PASSWORD_FILE: /run/secrets/proxy_password
    secrets:
      - proxy_user
      - proxy_password
    volumes:
      - seloger_browser_profile:/data/profile
    shm_size: 256m
    mem_limit: 2g
    cpus: 1
    init: true
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-browser"}]'
    restart: unless-stopped

secrets:
  garage_rpc_secret:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/garage_rpc_secret
  garage_access_key:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/garage_access_key
  garage_secret_key:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/garage_secret_key
  postgres_password:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/database_url
  jwt_secret:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/jwt_secret
  decodo_api_key:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/decodo_api_key
  decodo_web_data_api_key:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/decodo_web_data_api_key
  proxy_user:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/proxy_user
  proxy_password:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/proxy_password
  sendgrid_api_key:
    file: ${NESTSWIPE_SECRETS_DIR:-./secrets}/sendgrid_api_key

volumes:
  web_data_state:
  garage_data:
  garage_meta:
  seloger_browser_profile:
  pgdata:
  caddy_data:
  caddy_config:
  frontend_dist:
