services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  frontend-build:
    build:
      context: ../frontend
      target: build
      args:
        VITE_DD_APPLICATION_ID: ${VITE_DD_APPLICATION_ID}
        VITE_DD_CLIENT_TOKEN: ${VITE_DD_CLIENT_TOKEN}
        VITE_DD_SITE: ${VITE_DD_SITE:-datadoghq.com}
        VITE_DD_ENV: ${VITE_DD_ENV:-prod}
        VITE_DD_ALLOWED_TRACING_URL: ${VITE_DD_ALLOWED_TRACING_URL:-https://nestswipe.freeddns.org}
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /output/"]
    volumes:
      - frontend_dist:/output

  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_activity_query_size=4096
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "nestswipe-db"}]'
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      target: prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-listing-photos}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_POLL_INTERVAL_MINUTES: ${EMAIL_POLL_INTERVAL_MINUTES:-5}
      LISTING_PROBES_ENABLED: "false"
      DECODO_API_KEY: ${DECODO_API_KEY:-}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      SELOGER_BROWSER_URL: http://seloger-browser:8000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      GOOGLE_REDIRECT_URI: https://nestswipe.freeddns.org/api/v1/auth/google/callback
      ALLOWED_ORIGINS: https://nestswipe.freeddns.org
      FRONTEND_URL: https://nestswipe.freeddns.org
      # Datadog APM
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_SERVICE: nestswipe-backend
      DD_ENV: prod
      DD_VERSION: ${DD_VERSION:-latest}
      DD_TRACE_ENABLED: "true"
      DD_DBM_PROPAGATION_MODE: full
      DD_PSYCOPG_SERVICE: nestswipe-db
      DD_LOGS_INJECTION: "true"
      DD_IAST_ENABLED: "true"
      DD_PROFILING_ENABLED: "true"
      DD_DYNAMIC_INSTRUMENTATION_ENABLED: "true"
      # Datadog LLM Observability
      DD_LLMOBS_ENABLED: "true"
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-nestswipe}
    volumes:
      - ./oauth.json:/app/oauth.json:ro
      - /var/run/datadog:/var/run/datadog:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-backend"}]'
    restart: unless-stopped

  seloger-browser:
    build: ../browser
    environment:
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    volumes:
      - seloger_browser_profile:/data/profile
    shm_size: 256m
    mem_limit: 2g
    cpus: 1
    init: true
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-browser"}]'
    restart: unless-stopped

volumes:
  seloger_browser_profile:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
  frontend_dist:
