name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maintenance-tests:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_ENV: ci
      DD_SERVICE: nestswipe-maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - run: python -m unittest discover -s deploy/security -p 'test_*.py' -v
      - run: python -m unittest discover -s deploy -p 'test_provision_secrets.py' -v
      - run: bash deploy/security/test-scan-deployed-images.sh
      - run: shellcheck deploy/security/*.sh deploy/backup/*.sh deploy/remote-deploy.sh

  backend-tests:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_ENV: ci
      DD_SERVICE: nestswipe-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbm_test
          POSTGRES_PASSWORD: dbm_test
          POSTGRES_DB: nestswipe_dbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbm_test -d nestswipe_dbm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt
        working-directory: backend

      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com

      - name: Run tests
        run: pytest --tb=short -q --cov=app --cov-report=term --cov-report=xml:coverage.xml
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+psycopg://dbm_test:dbm_test@localhost:5432/nestswipe_dbm_test"
          JWT_SECRET: "test-secret-key"
          STORAGE_ENDPOINT: "localhost:9000"
          STORAGE_ACCESS_KEY: "test"
          STORAGE_SECRET_KEY: "test"
          DD_TRACE_ENABLED: ${{ env.DD_API_KEY != '' && 'true' || 'false' }}

      - name: Save backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  browser-tests:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_ENV: ci
      DD_SERVICE: nestswipe-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
          cache: pip
          cache-dependency-path: browser/requirements.txt
      - name: Install browser service dependencies
        run: pip install -r requirements.txt
        working-directory: browser
      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Test browser recovery and URL restrictions
        run: python -m unittest test_service -v
        working-directory: browser

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_ENV: ci
      DD_SERVICE: nestswipe-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Install matching Vitest coverage provider
        # Keep the CI-only provider on exactly the installed Vitest version.
        run: npm install --no-save "@vitest/coverage-v8@$(node -p 'require("./node_modules/vitest/package.json").version')"
        working-directory: frontend
      - name: Configure Datadog Test Optimization
        if: ${{ env.DD_API_KEY != '' }}
        uses: datadog/test-visibility-github-action@v3
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
      - name: Run tests with coverage
        run: npx vitest run --coverage
        working-directory: frontend
        env:
          NODE_OPTIONS: ${{ env.DD_TRACE_PACKAGE != '' && format('-r {0} --import {1}', env.DD_TRACE_PACKAGE, env.DD_TRACE_ESM_IMPORT) || '' }}
      - name: Save frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/cobertura-coverage.xml
          if-no-files-found: error
      - run: cd frontend && npm run build
      - name: Test the dependency audit policy
        run: node --test scripts/test-audit-dependencies.mjs
        working-directory: frontend
      - name: Audit dependencies with the approved temporary exception
        run: node scripts/audit-dependencies.mjs
        working-directory: frontend
      - run: cd frontend && npm audit --omit=dev --audit-level=moderate

  coverage-upload:
    needs: [backend-tests, frontend-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Upload coverage reports to Datadog
        uses: DataDog/coverage-upload-github-action@v1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
