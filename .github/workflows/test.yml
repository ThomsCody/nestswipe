name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s deploy/security -p 'test_*.py' -v
      - run: shellcheck deploy/security/*.sh deploy/backup/*.sh deploy/remote-deploy.sh

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbm_test
          POSTGRES_PASSWORD: dbm_test
          POSTGRES_DB: nestswipe_dbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbm_test -d nestswipe_dbm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt
        working-directory: backend

      - name: Run tests
        run: pytest --tb=short -q
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+psycopg://dbm_test:dbm_test@localhost:5432/nestswipe_dbm_test"
          JWT_SECRET: "test-secret-key"
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ROOT_USER: "test"
          MINIO_ROOT_PASSWORD: "test"
          DD_TRACE_ENABLED: "false"

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: browser/requirements.txt
      - name: Install browser service dependencies
        run: pip install -r requirements.txt
        working-directory: browser
      - name: Test browser recovery and URL restrictions
        run: python -m unittest test_service -v
        working-directory: browser

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx vitest run
      - run: cd frontend && npm run build
      - run: cd frontend && npm audit --audit-level=high
      - run: cd frontend && npm audit --omit=dev --audit-level=moderate
