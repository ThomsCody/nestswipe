services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nestswipe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rosen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "nestswipe-db"}]'

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      target: deps
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-config", "log_config.yaml"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rosen}:${POSTGRES_PASSWORD:-rosen_secret}@postgres:5432/${POSTGRES_DB:-nestswipe}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-listing-photos}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      EMAIL_POLL_INTERVAL_MINUTES: ${EMAIL_POLL_INTERVAL_MINUTES:-5}
      PROXY_HOST: ""
      PROXY_USER: ""
      PROXY_PASSWORD: ""
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      # Datadog APM
      DD_AGENT_HOST: datadog-agent
      DD_SERVICE: nestswipe-backend
      DD_ENV: dev
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
    volumes:
      - ./backend:/app
      - ./oauth.json:/app/oauth.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-backend"}]'

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_DD_ENV: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend-test:
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rosen}:${POSTGRES_PASSWORD:-rosen_secret}@postgres:5432/${POSTGRES_DB:-nestswipe}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-listing-photos}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    profiles:
      - test

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-nestswipe-local}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  minio_data:
