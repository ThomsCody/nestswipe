services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}
      POSTGRES_DB: ${POSTGRES_DB:-nestswipe}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rosen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "nestswipe-db"}]'

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: /garage server --single-node
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    secrets:
      - garage_rpc_secret
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: deps
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-config", "log_config.yaml"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rosen}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}@postgres:5432/${POSTGRES_DB:-nestswipe}
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-garage:3900}
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STORAGE_ACCESS_KEY_FILE: /run/secrets/garage_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/garage_secret_key
      STORAGE_BUCKET: ${STORAGE_BUCKET:-listing-photos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the Compose env file}
      EMAIL_POLL_INTERVAL_MINUTES: ${EMAIL_POLL_INTERVAL_MINUTES:-5}
      PROXY_HOST: ""
      PROXY_USER: ""
      PROXY_PASSWORD: ""
      SELOGER_BROWSER_URL: ${SELOGER_BROWSER_URL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      # Datadog APM
      DD_AGENT_HOST: datadog-agent
      DD_SERVICE: nestswipe-backend
      DD_ENV: dev
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      # Datadog LLM Observability
      DD_LLMOBS_ENABLED: "true"
      DD_LLMOBS_ML_APP: ${DD_LLMOBS_ML_APP:-nestswipe}
    volumes:
      - ./backend:/app
      - ./oauth.json:/app/oauth.json:ro
    secrets:
      - garage_access_key
      - garage_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "nestswipe-backend"}]'

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_DD_ENV: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend-test:
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rosen}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}@postgres:5432/${POSTGRES_DB:-nestswipe}
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-garage:3900}
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STORAGE_ACCESS_KEY_FILE: /run/secrets/garage_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/garage_secret_key
      STORAGE_BUCKET: ${STORAGE_BUCKET:-listing-photos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the Compose env file}
    secrets:
      - garage_access_key
      - garage_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    profiles:
      - test

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.86.0
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: ${DD_HOSTNAME:-nestswipe-local}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  garage_data:
  garage_meta:
  pgdata:

secrets:
  garage_rpc_secret:
    file: ./deploy/secrets/garage_rpc_secret
  garage_access_key:
    file: ./deploy/secrets/garage_access_key
  garage_secret_key:
    file: ./deploy/secrets/garage_secret_key
